name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
        run: |
          unzip -q PhoneTiltController-New.zip -d extracted
          test -f extracted/PhoneTiltController-New/settings.gradle

      - name: Build debug APK
        working-directory: extracted/PhoneTiltController-New
        run: gradle --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneTiltController-debug-apk
          path: extracted/PhoneTiltController-New/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
